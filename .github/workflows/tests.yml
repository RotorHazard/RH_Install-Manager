name: Baseline tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.10'
      - name: Unit tests and shell syntax
        run: python3 -m unittest discover -s tests -v
      - name: Python 3.6 compatibility smoke
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none -v "$PWD:/work:ro" -w /work \
            python:3.6.15-slim-buster@sha256:d59ee182c4629dd33b240b9bac1a6ff44276e79e66117eba17aed4016845d3b2 \
            python -B tests/python36_smoke.py
